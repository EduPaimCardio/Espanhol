<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.json">
<title>Vocabulário ES/EN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
header{background:#1e3a8a;color:#fff;text-align:center;padding:10px;font-weight:600;font-size:15px;position:sticky;top:0;z-index:5}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px #0002;text-align:center}
h1{font-size:22px;margin:8px 0}h2{font-size:34px;margin:6px 0}
.opt,.btn{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #cbd5e1;border-radius:14px;background:#fff;font-size:18px;cursor:pointer}
.opt.sel{border-color:#1e3a8a;background:#dbeafe}
.btn{background:#1e3a8a;color:#fff;border:0;font-weight:700}.btn:disabled{opacity:.4}
.emo{font-size:84px;line-height:1.1}
.tag{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:99px;padding:3px 12px;font-size:13px}
.s{background:#f8fafc;border-left:4px solid #1e3a8a;text-align:left;padding:8px 12px;border-radius:8px;font-size:17px}
.txt{text-align:left;font-size:18px;line-height:1.5}
mark{background:#fde047;padding:0 4px;border-radius:4px;font-weight:700}
.src{font-size:12px;color:#64748b;text-align:left}
.q{font-weight:700;margin-top:14px}
.opt.ok{background:#bbf7d0;border-color:#16a34a}.opt.no{background:#fecaca;border-color:#dc2626}
#sig{display:none;align-items:center;gap:12px;margin:12px 0;text-align:left;font-weight:600}
#sig i{width:44px;height:44px;border-radius:50%;flex:none;animation:p 1s infinite alternate}
#sig.g i{background:#22c55e;box-shadow:0 0 25px 10px #22c55e99}
#sig.r i{background:#ef4444;box-shadow:0 0 25px 10px #ef444499}
@keyframes p{to{transform:scale(1.18)}}
#nx{display:none;width:70px;height:70px;border-radius:50%;margin:10px auto 0;font-size:34px;background:#1e3a8a;color:#fff;border:0}
.sp{background:none;border:0;font-size:26px;cursor:pointer}
.top{display:flex;justify-content:space-between;font-size:13px;color:#475569;margin-bottom:8px}
.top button{border:0;background:none;color:#1e3a8a;font-weight:700}
.note{font-size:14px;color:#334155;margin-top:4px}
</style>
</head>
<body>
<header>Feito com Claude – versão 2</header>
<main>
<div id="setup" class="card">
  <h1>📚 Vocabulário</h1>
  <div class="q">Qual idioma deseja estudar?</div>
  <button class="opt" data-g="L" data-v="es">🇪🇸 Espanhol</button>
  <button class="opt" data-g="L" data-v="en">🇺🇸 Inglês</button>
  <div class="q">Qual o seu nível?</div>
  <button class="opt" data-g="V" data-v="1">Iniciante</button>
  <button class="opt" data-g="V" data-v="2">Intermediário</button>
  <button class="opt" data-g="V" data-v="3">Avançado</button>
  <button class="btn" id="go" disabled>Começar</button>
</div>
<div id="play" style="display:none">
  <div class="top"><span id="info"></span><button onclick="back()">⚙️ Trocar</button></div>
  <div class="card" id="box"></div>
</div>
</main>
<script>
// Formatos: w=[palavra,emoji,frase1,frase2,certa,errada,errada] t=[palavra,emoji,texto{destaque},fonte,certa,errada,errada]
// r=[verbo,emoji,frase com ___,certa,errada,errada,nota] c=[verbo,emoji,tempo/pessoa,certa,errada,errada]
const D={
es:{
1:{w:[["sueldo","💰","Mi sueldo llega el cinco de cada mes.","Ella quiere un sueldo más alto.","salário","sorte","dinheiro"],
["jefe","👔","Mi jefe llega temprano.","Hablé con el jefe sobre las vacaciones.","chefe","colega","cliente"],
["cita","📅","Tengo una cita con el médico a las tres.","¿Podemos cambiar la cita para mañana?","hora marcada / compromisso","citação","cidade"],
["contraseña","🔑","Olvidé mi contraseña del correo.","Elige una contraseña segura.","senha","contrato","conta"]],
t:[["ordenador","💻","Hoy muchas personas trabajan desde casa. Solo necesitan un {ordenador} y buena conexión a internet.","Tema inspirado em El País (Espanha)","computador","ordem","mesa"],
["móvil","📱","Cada vez más personas pagan con el {móvil} en las tiendas. Ya no llevan dinero en efectivo.","Tema inspirado em El País (Espanha)","celular","moeda","carteira"]],
r:[["soñar","💭","Anoche soñé ___ mi viaje a Chile.","con","de","en","soñar con = sonhar com"],
["empezar","🚀","Empiezo ___ trabajar a las ocho.","a","de","en","empezar a = começar a"]],
c:[["tener","🧳","Presente – nosotros","tenemos","tenamos","tienemos"],
["querer","❤️","Presente – yo","quiero","quero","quieró"]]},
2:{w:[["préstamo","🏦","Pedí un préstamo al banco para abrir mi negocio.","El préstamo se paga en doce cuotas.","empréstimo","prêmio","pedido"],
["alquilar","🏠","Voy a alquilar una oficina en el centro.","Es más barato alquilar que comprar.","alugar","alinhar","alcançar"],
["ahorrar","🐷","Quiero ahorrar para mis vacaciones.","Ahorrar energía reduce la factura.","economizar","gastar","atrasar"],
["encuesta","📋","La empresa hizo una encuesta entre los clientes.","Responde la encuesta en dos minutos.","pesquisa de opinião","encontro","encomenda"]],
t:[["tarjeta","💳","En Argentina, cada vez más comercios aceptan pago con {tarjeta} o por código QR, y el efectivo pierde terreno.","Tema inspirado em Clarín (Argentina)","cartão","tarifa","cheque"],
["ganancias","📈","Las {ganancias} de las pequeñas empresas crecieron gracias a las ventas por internet y a los envíos rápidos.","Tema inspirado em El Tiempo (Colômbia)","lucros","dívidas","impostos"]],
r:[["tardar","⏳","Tardamos tres horas ___ llegar.","en","a","de","tardar en = demorar para"],
["enterarse","📰","Me enteré ___ la noticia por la radio.","de","con","por","enterarse de = ficar sabendo de"]],
c:[["poder","💪","Pretérito indefinido – ellos","pudieron","podieron","pudieran"],
["hacer","🔨","Pretérito indefinido – yo","hice","hací","hizo"]]},
3:{w:[["plantilla","👥","La plantilla de la empresa supera los 500 empleados.","Despidieron a parte de la plantilla.","quadro de funcionários","planilha","planta"],
["recorte","✂️","Anunciaron un recorte del presupuesto.","El recorte de personal preocupa al sindicato.","corte / redução","recorde","retorno"],
["despido","📤","Recibió una carta de despido ayer.","El despido fue injustificado.","demissão (pelo empregador)","despedida","despesa"],
["ascenso","📈","Recibió un ascenso después de dos años.","El ascenso incluye un mejor sueldo.","promoção","rebaixamento","assento"]],
t:[["brecha","🌉","Aunque la inflación bajó, la {brecha} entre ricos y pobres sigue creciendo, y los expertos piden medidas urgentes.","Tema inspirado em El Universal (México)","lacuna / desigualdade","ponte","briga"],
["auge","🚀","El {auge} de la inteligencia artificial está cambiando el trabajo de oficina y obliga a las empresas a formar de nuevo a sus empleados.","Tema inspirado em El Mercurio (Chile)","boom / grande crescimento","queda","aposta"]],
r:[["contar","🧮","La empresa cuenta ___ cien empleados.","con","de","en","contar con = ter / contar com"],
["fijarse","🔍","Fíjate ___ los detalles del contrato.","en","a","con","fijarse en = reparar em / prestar atenção em"]],
c:[["saber","🧠","Subjuntivo presente – yo","sepa","sabo","sepo"],
["venir","🚪","Futuro – nosotros","vendremos","venremos","vendríamos"]]}},
en:{
1:{w:[["deadline","⏰","The deadline is next Friday.","We missed the deadline again.","prazo final","linha do tempo","reunião"],
["raise","📈","I asked my boss for a raise.","She got a raise last month.","aumento salarial","demissão","feriado"],
["coworker","🧑‍🤝‍🧑","My coworker helps me every day.","I had lunch with a coworker.","colega de trabalho","cliente","chefe"],
["invoice","🧾","Please send me the invoice.","The invoice is due on Monday.","fatura / nota de cobrança","convite","fábrica"]],
t:[["commute","🚆","More people work from home now. They save time because there is no long {commute} to the office.","Tema inspirado em The Guardian (Reino Unido)","deslocamento casa-trabalho","comunicado","comida"],
["shipping","📦","Many shops now offer free {shipping} when you spend more than fifty dollars online.","Tema inspirado em The New York Times (EUA)","frete / envio","navio","compras"]],
r:[["listen","🎧","I listen ___ music on the bus.","to","at","for","listen to = ouvir (algo)"],
["wait","⌛","We are waiting ___ the manager.","for","to","at","wait for = esperar por"]],
c:[["go","🚶","Simple past","went","goed","gone"],
["buy","🛒","Simple past","bought","buyed","buyt"]]},
2:{w:[["workload","🗂️","My workload is heavy this week.","They want to reduce the workload.","carga de trabalho","salário","ritmo de viagem"],
["shortage","📉","There is a shortage of skilled workers.","A water shortage affected the farms.","escassez","atalho","excesso"],
["hire","🤝","We plan to hire five people.","They hired a new designer.","contratar","alugar","demitir"],
["bid","🏷️","Our company won the bid.","They made a bid for the old factory.","proposta / oferta","fatura","pedido de demissão"]],
t:[["turnover","🔄","Because of low pay, the {turnover} in the restaurant industry is very high, and managers struggle to keep trained staff.","Tema inspirado em The Guardian (Reino Unido)","rotatividade de funcionários","volta ao trabalho","lucro"],
["headquarters","🏢","The company moved its {headquarters} to Texas to cut costs and attract new talent.","Tema inspirado em The Wall Street Journal (EUA)","sede / matriz","cabeçalho","quarto"]],
r:[["apply","📝","She applied ___ a new job.","for","to","at","apply for = candidatar-se a (vaga)"],
["agree","🤝","I agree ___ you about the budget.","with","to","for","agree with = concordar com (alguém)"]],
c:[["write","✍️","Past participle (have ___)","written","wrote","writed"],
["choose","☑️","Simple past","chose","choosed","chosen"]]},
3:{w:[["leverage","⚙️","We can leverage our data to grow.","She used her contacts as leverage.","alavancar / aproveitar","emprestar","nivelar"],
["bottleneck","🍾","Slow approvals created a bottleneck.","The bridge is a traffic bottleneck.","gargalo","garrafa","atraso de entrega"],
["streamline","🌊","We need to streamline the process.","Streamlining cut our costs.","simplificar / otimizar","transmitir ao vivo","alongar"],
["outsource","🌍","They outsource customer support.","It is cheaper to outsource.","terceirizar","exportar","superar"]],
t:[["downturn","📉","Economists warn that a sharp {downturn} could force companies to freeze hiring and delay new projects.","Tema inspirado em Financial Times (Reino Unido)","queda / recessão","retomada","fusão"],
["thrive","🌱","Small firms that adapt quickly to new technology tend to {thrive} even when the market is uncertain.","Tema inspirado em The Economist (Reino Unido)","prosperar","fechar as portas","reclamar"]],
r:[["comply","📜","All staff must comply ___ safety rules.","with","to","by","comply with = cumprir / estar em conformidade com"],
["result","⚠️","Poor planning can result ___ delays.","in","to","with","result in = resultar em"]],
c:[["withdraw","🏧","Past participle (have ___)","withdrawn","withdrew","withdrawed"],
["overcome","🏔️","Simple past","overcame","overcomed","overcame it"]]}}};
const SEQ=["w","t","w","r","t","c"];
let L,V,i=0,used={},cur,done=false,wl;
const $=s=>document.querySelector(s);
const sh=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const sel={};
document.querySelectorAll(".opt[data-g]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(`.opt[data-g=${b.dataset.g}]`).forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");sel[b.dataset.g]=b.dataset.v;$("#go").disabled=!(sel.L&&sel.V);});
$("#go").onclick=()=>{L=sel.L;V=sel.V;i=0;used={};$("#setup").style.display="none";$("#play").style.display="block";
  $("#info").textContent=(L=="es"?"🇪🇸 Espanhol":"🇺🇸 Inglês")+" · "+["","Iniciante","Intermediário","Avançado"][V];lock();next();};
function back(){$("#play").style.display="none";$("#setup").style.display="block";}
async function lock(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")lock()});
document.addEventListener("touchstart",()=>{if(!wl||wl.released)lock()},{passive:true});
function pick(t){const p=D[L][V][t];used[t]=used[t]||[];let a=p.map((_,k)=>k).filter(k=>!used[t].includes(k));
  if(!a.length){used[t]=[];a=p.map((_,k)=>k)}const k=a[Math.floor(Math.random()*a.length)];used[t].push(k);return p[k]}
const hl=(s,w)=>s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),m=>`<b>${m}</b>`);
function say(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.speak);u.lang=L=="es"?"es-ES":"en-US";speechSynthesis.speak(u)}catch(e){}}
function next(){
  done=false;const t=SEQ[i++%SEQ.length],it=pick(t);let h,o,ok;
  const sp='<button class="sp" onclick="say()">🔊</button>';
  if(t=="w"){cur={t,it,speak:it[0]};o=it.slice(4,7);ok=it[4];
    h=`<span class=tag>Palavra nova</span><div class=emo>${it[1]}</div><h2>${it[0]} ${sp}</h2><p class=s>${hl(it[2],it[0])}</p><p class=s>${hl(it[3],it[0])}</p><div class=q>Qual é a tradução?</div>`}
  else if(t=="t"){cur={t,it,speak:it[2].replace(/[{}]/g,"")};o=it.slice(4,7);ok=it[4];
    h=`<span class=tag>Texto do dia</span><div class=emo>${it[1]}</div><p class=txt>${it[2].replace(/\{(.+?)\}/,"<mark>$1</mark>")} ${sp}</p><div class=src>${it[3]}</div><div class=q>O que significa a palavra em destaque?</div>`}
  else if(t=="r"){cur={t,it,speak:it[2].replace("___",it[3])};o=it.slice(3,6);ok=it[3];
    h=`<span class=tag>Regência verbal</span><div class=emo>${it[1]}</div><h2>${it[0]}</h2><p class=s id=bl>${it[2].replace("___","<u>_____</u>")}</p><div class=q>Qual preposição completa a frase?</div>`}
  else{cur={t,it,speak:it[3]};o=it.slice(3,6);ok=it[3];
    h=`<span class=tag>Conjugação</span><div class=emo>${it[1]}</div><h2>${it[0]}</h2><p class=note>${it[2]}</p><div class=q>Qual é a forma correta?</div>`}
  cur.ok=ok;
  h+=sh(o).map(x=>`<button class=opt data-a="${x.replace(/"/g,"&quot;")}">${x}</button>`).join("")+
     `<div id=sig><i></i><span id=st></span></div><div id=nt class=note></div><button id=nx onclick="next()" aria-label="Próxima">➜</button>`;
  $("#box").innerHTML=h;scrollTo(0,0);
  document.querySelectorAll("#box .opt").forEach(b=>b.onclick=()=>pickOpt(b));
}
function pickOpt(b){
  if(done)return;done=true;const v=b.dataset.a,good=v===cur.ok;
  document.querySelectorAll("#box .opt").forEach(x=>{if(x.dataset.a===cur.ok)x.classList.add("ok")});
  if(!good)b.classList.add("no");
  const s=$("#sig");s.className=good?"g":"r";s.style.display="flex";
  $("#st").textContent=good?"Correto! 🎉":"Errado. Resposta correta: "+cur.ok;
  if(cur.t=="r"){$("#bl").innerHTML=cur.it[2].replace("___",`<b style="color:#16a34a">${cur.ok}</b>`);$("#nt").textContent=cur.it[6]}
  $("#nx").style.display="block";
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
